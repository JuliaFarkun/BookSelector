<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подбор книг</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <h1 class="logo">Книго<span>подбор</span></h1>
      <p class="tagline">Напишите запрос или выберите метки — и нажмите «Найти».</p>
    </div>
  </header>

  <main class="main">
    <div class="layout">
      <aside class="sidebar panel" aria-label="Поиск и фильтры">
        <form id="search-form" class="search-row" action="#" method="get">
          <label class="sr-only" for="search-input">Поиск</label>
          <input type="text" id="search-input" class="search-input" placeholder="Название, автор или слово из описания…" autocomplete="off" enterkeyhint="search">
          <div class="search-row__actions">
            <button type="submit" id="search-btn" class="btn btn--primary">Найти</button>
            <button type="button" id="reset-btn" class="btn btn--ghost">Сбросить</button>
          </div>
        </form>

        <div class="filter-stack" role="group" aria-label="Метки для включения и исключения">
          <div class="filter-block">
            <h3 class="filter-block__title">Нужны эти метки</h3>
            <div class="filter-actions" id="category-filters-include"></div>
          </div>
          <div class="filter-block">
            <h3 class="filter-block__title">Этих меток быть не должно</h3>
            <div class="filter-actions" id="category-filters-exclude"></div>
          </div>
        </div>

        <div class="filter-summaries-wrap" id="filter-summaries-wrap" hidden>
          <h3 class="filter-summaries__title">Выбрано</h3>
          <div id="filter-summaries" class="filter-summaries"></div>
        </div>
      </aside>

      <section class="results" aria-live="polite">
        <div class="results__head">
          <h2 class="results__title">Результаты</h2>
          <span id="results-count" class="results__count"></span>
        </div>
        <p id="status" class="status" role="status"></p>
        <div id="book-grid" class="book-grid"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>Каталог и темы берутся из SQL-дампа БД. Запуск: <code>npm start</code> → <code>http://localhost:3780</code>.</p>
  </footer>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
