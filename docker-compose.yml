services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookmatch
      POSTGRES_USER: bookmatch
      POSTGRES_PASSWORD: bookmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./booksmatch_bd.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    depends_on:
      - db
    ports:
      - "80:3780"
    environment:
      PORT: 3780
      DATABASE_URL: postgres://bookmatch:bookmatch@db:5432/bookmatch
      ADMIN_KEY: changeme
      PGSSL_DISABLE: "true"
    command: sh -c "npm start"

volumes:
  postgres_data:
